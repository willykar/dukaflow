# Local infrastructure: single-node Kafka (KRaft, no ZooKeeper) and PostgreSQL.
# Airflow is added in phase 4 from its own official compose file.
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: duka-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  postgres:
    image: postgres:16
    container_name: duka-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: duka
      POSTGRES_PASSWORD: duka
      POSTGRES_DB: dukaflow
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
